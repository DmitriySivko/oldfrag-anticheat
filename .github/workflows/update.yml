name: Update CS 1.6 evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python collector.py
      - run: python generator.py
      - name: Commit changed evidence and database
        run: |
          git config user.name "oldfrag-anticheat-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json data/quarantine.json dist
          git diff --cached --quiet || git commit -m "chore: update CS 1.6 evidence"
          git push
